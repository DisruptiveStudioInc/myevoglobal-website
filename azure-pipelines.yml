# Node.js
# Build a general Node.js project with npm.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/javascript

trigger:
- main

pool:
  name: Disruptive

steps:
- task: SSH@0
  inputs:
    sshEndpoint: 'evo-ecommerce'
    runOptions: 'inline'
    # Docker writes normal progress to stderr; set -e handles command failures.
    failOnStdErr: false
    inline: |
      set -eu
      cd /var/www/$(Build.Repository.Name)
      sudo git reset --hard
      sudo git pull
      sudo docker compose pull myevoglobal-website
      sudo docker compose up -d --force-recreate --no-deps --wait myevoglobal-website
      sudo docker compose exec -T myevoglobal-website php -r 'exit(PHP_VERSION === "8.5.12" ? 0 : 1);'
    readyTimeout: '20000'
